<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spark Engine — Showcase</title>
    <link rel="icon" href="data:," />
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #05060a; overflow: hidden; }
      #app { position: relative; width: 100%; height: 100%; }
      #error { position: absolute; inset: 0; display: none; place-items: center; color: #ffb4b4; background: #1a0a0a; font: 14px/1.5 ui-monospace, Consolas, monospace; padding: 24px; white-space: pre-wrap; }
      #loading { position: absolute; inset: 0; display: grid; place-items: center; color: #9aa4bd; background: #05060a; font: 13px/1.5 ui-monospace, Consolas, monospace; letter-spacing: 0.04em; pointer-events: none; }
      #loading[hidden] { display: none; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="loading">Starting…</div>
    <div id="error"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
